# Tiny Tapeout project information
project:
  title:        "0-DSP Spiking Neural Network XOR"
  author:       "Tianyue-C"
  discord:      ""
  description:  "2-8-1 0-DSP LIF Spiking Neural Network solving XOR with arithmetic-shift leak decay"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tianyue_snn_xor"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "snn_xor_top.v"
    - "lif_neuron.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "spike_in[0]"
  ui[1]: "spike_in[1]"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "spike_out"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "hidden_spikes[0]"
  uio[1]: "hidden_spikes[1]"
  uio[2]: "hidden_spikes[2]"
  uio[3]: "hidden_spikes[3]"
  uio[4]: "hidden_spikes[4]"
  uio[5]: "hidden_spikes[5]"
  uio[6]: "hidden_spikes[6]"
  uio[7]: "hidden_spikes[7]"

# Do not change!
yaml_version: 6
